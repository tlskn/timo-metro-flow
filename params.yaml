split:
  source_file: data-62743-08-09-2026.csv
  initial_until: 20242          # год * 10 + квартал, включительно
  batches:                      # [начало, конец] включительно
    - [20243, 20244]
    - [20251, 20252]
    - [20253, 20254]
    - [20261, 20262]

seed: 42                        # для всех генераторов случайных чисел проекта

quality:
  max_bad_share: 0.01           # доля записей с нарушениями, после которой порция отклоняется
  max_flow: 15000000            # верхняя граница потока станции за квартал
  in_out_ratio: [0.5, 2.0]      # допустимое отношение входов к выходам
  min_rows: 250                 # минимум станций в одном квартале
